name: Publish approved staging static release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the approved source branch tip (40 characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mariyas-staging-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feature/authentic-media-typography'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://www.mariyasnaturals.cloud
      SITE_ENV: development
      ALLOW_INDEXING: 'false'
    steps:
      - name: Admit only the selected approved branch revision
        id: identity
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests/pull -v
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:media-policy
      - name: Browser and accessibility validation
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')" npm run test:browser
      - run: npm run package:staging
      - uses: actions/upload-artifact@v4
        with:
          name: validated-staging-input
          path: review-artifacts/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/feature/authentic-media-typography'
    runs-on: ubuntu-latest
    environment: staging-release
    permissions:
      contents: write
    steps:
      - name: Require owner-configured protected environment
        env:
          ENABLED: ${{ vars.STAGING_RELEASES_ENABLED }}
        run: test "$ENABLED" = owner-approved
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-staging-input
          path: review-artifacts/
      - name: Sign validated manifest (no VPS SSH credentials)
        env:
          STAGING_RELEASE_SIGNING_KEY: ${{ secrets.STAGING_RELEASE_SIGNING_KEY }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: python3 ops/prepare_release.py --bundle review-artifacts --output signed-release --source-sha "$SOURCE_SHA" --sequence "$GITHUB_RUN_NUMBER"
      - name: Publish only compiled signed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/publish_release.py
