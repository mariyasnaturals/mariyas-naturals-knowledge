name: Prepare staging review artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://www.mariyasnaturals.cloud
      SITE_ENV: development
      ALLOW_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install and verify FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffprobe
          ffprobe -version
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:media-policy
      - name: Run existing browser and accessibility tests
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')" npm run test:browser
      - run: npm run package:staging
      - uses: actions/upload-artifact@v4
        with:
          name: mariyas-cloud-staging-review-${{ github.sha }}
          path: review-artifacts/
          retention-days: 30
          if-no-files-found: error
