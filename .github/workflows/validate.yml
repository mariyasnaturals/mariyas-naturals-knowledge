name: Validate foundation
on:
  pull_request:
  push:
    branches: [main, feature/astro-foundation, feature/cinematic-homepage]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://www.mariyasnaturals.cloud
      SITE_ENV: development
      ALLOW_INDEXING: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install FFmpeg for original-media verification
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffprobe
          ffprobe -version
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests/pull -v
      - run: python3 -m unittest discover -s tests/cinematic-release -v
      - run: python3 -m unittest discover -s tests/readiness -v
      - run: python3 -m unittest discover -s tests/staging-auto -v
      - run: python3 -m unittest discover -s tests/ci-staging -v
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:media-policy
      - name: Browser and accessibility checks
        run: |
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')" npm run test:browser
      - name: Package CI staging payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cinematic-homepage'
        run: node scripts/package-ci-staging.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cinematic-homepage'
        with:
          name: unsigned-ci-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-staging-unsigned/
          retention-days: 30
          if-no-files-found: error
      - name: Package UNAPPROVED PR preview (NOT FOR DEPLOYMENT)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cinematic-homepage'
        run: npm run package:pr-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cinematic-homepage'
        with:
          name: UNAPPROVED-cinematic-pr-preview-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: pr-preview-artifacts/
          retention-days: 30
          if-no-files-found: error

  authenticate-staging:
    needs: static-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cinematic-homepage' && vars.STAGING_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cinematic-staging-auto
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-ci-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-staging-input
      - name: Authenticate data with dedicated staging identity
        env:
          STAGING_AUTOMATION_KEY: ${{ secrets.STAGING_AUTOMATION_KEY }}
          STAGING_AUTOMATION_KEY_SHA256: ${{ vars.STAGING_AUTOMATION_KEY_SHA256 }}
        run: python3 -I ops/ci_staging/cli.py sign --input "$RUNNER_TEMP/ci-staging-input" --output "$RUNNER_TEMP/ci-staging-authenticated"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-staging-authenticated/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
