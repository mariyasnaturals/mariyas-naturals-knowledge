name: Validate foundation
on:
  pull_request:
  push:
    branches: [main, feature/astro-foundation]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://www.mariyasnaturals.cloud
      SITE_ENV: development
      ALLOW_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:media-policy
