name: Validate foundation
on:
  pull_request:
  push:
    branches: [main, feature/astro-foundation]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://www.mariyasnaturals.cloud
      SITE_ENV: development
      ALLOW_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:media-policy
      - name: Package approved staging review (PR artifacts only)
        if: github.event_name == 'pull_request'
        run: npm run package:staging
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: mariyas-cloud-staging-review-${{ github.event.pull_request.head.sha }}
          path: review-artifacts/
          retention-days: 30
          if-no-files-found: error
