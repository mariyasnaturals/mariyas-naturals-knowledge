name: Acquire official store snapshot

# Read-only acquisition of the public .com catalogue and its product
# photographs, followed by the approved local derivative build. This job exists
# because the review environment has no egress to mariyasnaturals.com; it never
# publishes a release, never signs anything and never touches ops/.
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'scripts/fetch-com-snapshot.mjs'
      - 'scripts/sync-com-catalogue.mjs'
      - 'src/config/media-policy.mjs'
      - '.github/workflows/com-catalogue-sync.yml'

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - name: Download the public store API and every product photograph
        run: |
          node scripts/fetch-com-snapshot.mjs
          du -sh /tmp/com-snapshot /tmp/com-snapshot/images
      - name: Build the approved local derivatives and manifests
        run: |
          set +e
          node scripts/sync-com-catalogue.mjs --snapshot /tmp/com-snapshot 2>&1 | tee /tmp/sync-report.txt
          echo "exit=${PIPESTATUS[0]}" >> /tmp/sync-report.txt
          set -e
          du -sh public/images/products || true
      - name: Commit the approved result (or the failure report) for review
        run: |
          git config user.name 'mariyas-catalogue-sync'
          git config user.email 'catalogue-sync@users.noreply.github.com'
          cp /tmp/sync-report.txt sync-report.txt
          git add -A src/data public/images/products docs/official-store-sync.md sync-report.txt
          git diff --cached --stat
          git commit -m 'chore(media): approved official-store catalogue and derivatives' || echo 'nothing to commit'
          git push origin HEAD:${{ github.ref_name }} || echo 'push skipped'
